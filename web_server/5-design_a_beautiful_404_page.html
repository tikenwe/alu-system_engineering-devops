<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Lost in Space</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #fff;
    background: radial-gradient(circle at top, #1b2a6b, #05081c 70%);
    overflow: hidden;
  }
  .stars, .stars::before, .stars::after {
    content: "";
    position: absolute;
    width: 3px; height: 3px;
    background: #fff;
    border-radius: 50%;
    box-shadow:
      10vw 12vh #fff, 25vw 70vh #fff, 40vw 20vh #fff, 55vw 85vh #fff,
      70vw 30vh #fff, 85vw 60vh #fff, 92vw 10vh #fff, 15vw 90vh #fff,
      60vw 50vh #fff, 33vw 45vh #fff, 78vw 80vh #fff, 5vw 55vh #fff;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle { from { opacity: .3; } to { opacity: 1; } }
  .box { position: relative; z-index: 1; padding: 20px; }
  h1 {
    font-size: clamp(5rem, 22vw, 11rem);
    letter-spacing: .05em;
    background: linear-gradient(90deg, #ff6ec4, #7873f5, #4ade80);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .rocket {
    font-size: 4rem;
    display: inline-block;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }
  p { font-size: 1.3rem; margin: 12px 0; opacity: .9; }
  .french { font-style: italic; opacity: .7; }
  a {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 28px;
    border-radius: 999px;
    background: linear-gradient(90deg, #7873f5, #ff6ec4);
    color: #fff;
    text-decoration:
none;
    font-weight: 600;
    transition: transform .2s;
  }
  a:hover { transform: scale(1.08); }
</style>
</head>
<body>
  <div class="stars"></div>
  <div class="box">
    <div class="rocket">&#128640;</div>
    <h1>404</h1>
    <p>Houston, we have a problem. This page drifted out of orbit.</p>
    <p class="french">Ceci n'est pas une page</p>
    <a href="/">Take me back home</a>
  </div>
</body>
</html>
